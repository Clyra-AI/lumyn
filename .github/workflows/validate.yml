name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Pin npm
        run: npm install --global npm@11.4.1 --ignore-scripts --no-audit --no-fund

      - name: Verify Node and npm pins
        run: |
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "11.4.1"

      - name: Run full validation
        run: make prepush-full

      - name: Validate immutable lifecycle evidence
        run: python3 scripts/validate_repo_pack.py --lifecycle-evidence
